<!DOCTYPE html>
<html>
<head>
    <title>Music Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .album {
            text-align: center;
        }

        .vinyl {
            width: 180px;
            height: 180px;
            margin: auto;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                #111 0px,
                #333 5px,
                #111 10px
            );
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 4s linear infinite;
        }

        .vinyl::after {
            content: "";
            width: 35px;
            height: 35px;
            background: #38bdf8;
            border-radius: 50%;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .album h3 {
            margin-top: 20px;
        }

        .playlist h2 {
            margin-bottom: 15px;
        }

        .track {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #334155;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .track:hover {
            transform: translateX(6px);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .controls button {
            padding: 10px 18px;
            border: none;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 200px 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="album">

            <div class="vinyl"></div>

            <h3>Midnight Echoes</h3>
            <p>Cyber Wave • 2026</p>

            <div class="controls">
                <button>⏮</button>
                <button>▶</button>
                <button>⏭</button>
            </div>

        </div>

        <div class="playlist">

            <h2>Up Next</h2>

            <div class="track">
                <span>01. Neon Route</span>
                <span>3:42</span>
            </div>

            <div class="track">
                <span>02. Silicon Drift</span>
                <span>4:15</span>
            </div>

            <div class="track">
                <span>03. Digital Rain</span>
                <span>2:58</span>
            </div>

            <div class="track">
                <span>04. Night Ride</span>
                <span>3:10</span>
            </div>

        </div>

    </div>

</body>
</html>
